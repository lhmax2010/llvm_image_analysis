<style type="text/css"><!--
/* Custom Header */
.custom-header {
    display: contents;
}
.custom-header .navbar {
    overflow: hidden;
    background-color: #333;
    font-family: Sans-serif;
}

.custom-header .navbar a {
    float: left;
    font-size: 12px;
    color: white;
    text-align: center;
    padding: 10px 12px;
    text-decoration: none;
}

.custom-header .dropdown {
    float: left;
    overflow: hidden;
}

.custom-header .dropdown-sub {
    float: left;
    overflow: hidden;
}

.custom-header .dropdown-sub-x {
    float: left;
    overflow: hidden;
}

.custom-header .dropdown .dropbtn {
    font-size: 12px;
    font-weight: bold;
    border: none;
    outline: none;
    color: white;
    padding: 10px 12px;
    background-color: #333;
    font-family: inherit;
    margin: 0;
    cursor:pointer;
}

.custom-header .dropdown-sub .dropbtn-sub {
    text-align: left;
    font-size: 12px;    
    border: none;
    outline: none;
    padding: 8px 8px;
    background-color: #ffdead;
    min-width: 180px;
    font-family: inherit;
    font-weight: bold;
    margin: 0;
    cursor:pointer;
}

.custom-header .dropdown-sub-x .dropbtn-sub-x {
    text-align: left;
    font-size: 12px;    
    border: none;
    outline: none;
    padding: 8px 8px;
    background-color: #CCF29D;
    min-width: 180px;
    font-family: inherit;
    font-weight: bold;
    margin: 0;
    cursor:pointer;
}

.custom-header .navbar a:hover, .dropdown:hover .dropbtn {
    background-color: red;
}

.custom-header .navbar a:hover, .dropdown-sub:hover .dropbtn-sub {
    background-color: #ff8c66;
}

.custom-header .dropdown-sub-x:hover .dropbtn-sub-x {
    background-color: #A9DF67;
}

.custom-header .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f3f3f3;
    min-width: 160px;
    z-index: 1;
}

.custom-header .dropdown-sub-content {
    position: relative;
    background-color: #f3f3f3;
    min-width: 160px;
    z-index: 1;
    margin-left: 10px;
}

.custom-header .dropdown-content a {
    float: none;
    color: black;
    padding: 8px 8px;
    text-decoration: none;
    display: block;
    text-align: left;
    margin-left: 20px;
    box-shadow: 0px 4px 4px 0px rgba(0,0,0,0.1);
    background-color: #ffffff;
}

.custom-header .dropdown-sub-content a {
    float: none;
    color: #4B0505;
    font-size: 12px;
    padding: 8px 8px;
    text-decoration: none;
    display: block;
    text-align: left;
    box-shadow: 0px 4px 4px 0px rgba(0,0,0,0.1);
}

.custom-header .dropdown-content a:hover {
    background-color: #ddd;
}

.custom-header .dropdown-sub-content a:hover {
    background-color: #ddd;
}

.custom-header .dropdown:hover .dropdown-content {
    display: block;
}
.dropdown-sub:hover .dropdown-sub-content {
    display: block;
}


.custom-header .shutdown-notice {
    display: block;
    margin-block-start: 1em;
    margin-block-end: 1em;
    margin-inline-start: 0px;
    margin-inline-end: 0px;
    font-family: Verdana,sans-serif;
    font-size: 12px;
    line-height: 1.5;
    font-weight: bold;
    color: #fff!important;
    background-color: Tomato!important;
    padding-left: 30px;
    padding-top: 10px;
    padding-bottom: 10px;
    margin-top: 0px;
    margin-bottom: 0px;
}

.tab-MyPage {
display: none;
}

/* samsung plugins */
.manifestview-top{
	display: flex;
}

.manifestview-table .filter-controls {
	display: none;
}

.manifestview-table .navigation {
	display: none;
}

.recommended-build-gadget-datatable .filter-controls {
	display: none;
}

.recommended-build-gadget-datatable .navigation {
	display: none;
}

.submitrequest-buildrequest-field-wrapper {
	color: rgb(var(--qb-color-border-default) /1));
}

.submitrequest-status-top .status-filter {
	display: flex;
}

.submitrequest-status-table .build-info {
	white-space: nowrap;
}

.submitrequest-status-table .filter-controls {
	display: none;
}

.submitrequest-status-reject-btn > span {
	color: rgb(var(--qb-color-danger) / var(--tw-text-opacity));
}

.submitrequest-full-packagelist-table td.name {
	width: 25%;
	max-width: 24rem;
	text-align: right;

    --table-td-bg: var(--qb-table-settings-td-name-bg);
    --table-td-border-width: 0 1px 0 0;
}

.submitrequest-full-packagelist-table td.value {
    --table-td-border-width: 0;
    --table-td-padding-x: 20px;
}

.submitrequest-buildrequest-textarea, .submitrequest-full-packagelist-textarea {
   	display: block;
  	width: 100%;
  	-webkit-appearance: none;
		-moz-appearance: none;
			appearance: none;
	background-clip: padding-box;
  	outline: 2px solid transparent;
  	outline-offset: 2px;

  	--tw-ring-color: rgb(var(--input-ring-color) / var(--tw-ring-opacity));
	padding: var(--input-padding-y) var(--input-padding-x);
  	font-size: var(--input-font-size);
	  font-weight: var(--input-font-weight);
	  font-family: var(--input-font-family);
	  line-height: var(--input-line-height);
	  background-color: rgb(var(--input-bg) / var(--tw-bg-opacity));
	  color: rgb(var(--input-fg) / var(--tw-text-opacity));
	  border-width: var(--input-border-width);
	  border-style: var(--input-border-style);
	  border-color: rgb(var(--input-border-color) / var(--tw-border-opacity));
	  border-radius: var(--input-radius);
	  min-height: calc(var(--input-line-height) + var(--input-padding-y) * 2 + var(--input-border-width) * 2);

	  box-shadow: var(--input-box-shadow, 0 1px 2px 0 var(--input-shadow-color-rgb));
	  transition: var(--input-transition);
}

.submitrequest-full-packagelist-textarea {
	max-height: 150px;
	width: 100%
}

.controls-wrapper {
	float: inline-end;
}

.submitrequest-buildrequest-field-wrapper{
	display: contents;
}

.submitrequest-status-table .navigation {
	display: none;
}
.submitrequest-status-table .build-info .flex-wrap {
	flex-wrap: nowrap !important;
}

.submitrequest-status-table p {
	margin-bottom: unset;
}

.ui-dialog .submits {
	display: flex;
}

.ui-dialog .submits button {
	width: 50%
}


/* Build Overview */
#build-dashboard table {
	width : 100%
}
#build-dashboard table thead {
	background-color: #c8c8c8	;
}

/* PII securty */
#user-management table {
	user-select: none
}

.error-wrapper .inline-block {
	display: none !important;
}
